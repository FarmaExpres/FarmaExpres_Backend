<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="650" viewBox="0 0 1100 650" role="img" aria-labelledby="title desc">
  <title id="title">HU-JFBM-002 estado de servicios Docker</title>
  <desc id="desc">Resumen visual del estado de servicios Docker Compose para el stack local de FarmaExpres.</desc>
  <rect width="1100" height="650" fill="#f8fafc"/>
  <rect x="48" y="42" width="1004" height="560" rx="18" fill="#ffffff" stroke="#d8e2ef"/>
  <rect x="48" y="42" width="1004" height="96" rx="18" fill="#1d4ed8"/>
  <text x="88" y="98" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="700" fill="#ffffff">Verificacion Docker Compose</text>
  <text x="88" y="166" font-family="Segoe UI, Arial, sans-serif" font-size="19" fill="#334155">Comando: docker compose ps</text>
  <text x="88" y="202" font-family="Segoe UI, Arial, sans-serif" font-size="19" fill="#334155">Entorno: servicios Docker locales</text>

  <rect x="88" y="245" width="924" height="58" rx="10" fill="#eff6ff" stroke="#bfdbfe"/>
