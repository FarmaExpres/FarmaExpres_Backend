server:
  port: 8084

spring:
  application:
    name: audit-service

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        default_schema: ${DB_SCHEMA:audit}
    show-sql: false
  jackson:
    time-zone: UTC

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    root: INFO
    org.springframework.security: WARN

jwt:
  secret: ${JWT_SECRET:mi_clave_super_secreta_ultra_segura_de_256_bits_minimo_1234567890}

inventory:
  service-url: ${INVENTORY_SERVICE_URL:http://inventory-service:8082}
  timeout-ms: ${INVENTORY_SERVICE_TIMEOUT_MS:5000}
