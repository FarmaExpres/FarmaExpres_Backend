databaseChangeLog:
  - changeSet:
      id: inventory-001-create-product-table
      author: System
      comment: Crea la tabla base de productos.
      changes:
        - sqlFile:
            path: 001_create_product_table.sql
            relativeToChangelogFile: true
            stripComments: false
