server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      routes:
        - id: auth-service-auth
          uri: http://auth-service:8081
          predicates:
            - Path=/api/auth/**

        - id: auth-service-users
          uri: http://auth-service:8081
          predicates:
            - Path=/api/users/**

        - id: inventory-service-products
          uri: http://inventory-service:8082
          predicates:
            - Path=/api/products/**

        - id: inventory-service-movements
          uri: http://inventory-service:8082
          predicates:
            - Path=/api/movements/**

      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:3000"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"

management:
  endpoints:
    web:
      exposure:
        include: health,info