server:
  port: 0

spring:
  datasource:
    url: jdbc:h2:mem:farmaexpres_inventory_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
    show-sql: false
  sql:
    init:
      mode: never

jwt:
  secret: test_secret_for_inventory_service_tests_1234567890

management:
  endpoints:
    web:
      exposure:
        include: health,info
